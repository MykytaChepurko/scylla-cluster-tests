test_duration: 900
stress_cmd: ["cassandra-stress mixed no-warmup n=117000000 cl=QUORUM -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=100 -col 'n=FIXED(8) size=FIXED(400)' -pop seq=1..117000000 -log interval=5"]

xcloud_replication_factor: 3
n_loaders: 1

n_monitor_nodes: 1

user_prefix: 'xcloud-scale-out-aws-80-75-mixed'
instance_provision: 'on_demand'
scylla_version: '2026.1.2'

scaling_config: {
    "InstanceFamilies": [
      "i4i"
    ],
    "Mode": "xcloud",
    "Policies": {
      "Storage": {
        "Min": 0,
        "TargetUtilization": 0.8
      },
      "VCPU": {
        "Min": 0
      }
    }
}
