test_duration: 800

stress_cmd: [
"scylla-bench -workload=sequential -mode=mixed -replication-factor=3 -partition-count=85000000 -clustering-row-count=1 -clustering-row-size=9000 -concurrency=100 -timeout=180s -connection-count=100 -retry-number=10 -retry-interval=40s -duration=90m"
]


xcloud_replication_factor: 3
n_loaders: 1

n_monitor_nodes: 1

user_prefix: 'scale-out-aws-80-75-mixed'
instance_provision: 'on_demand'
scylla_version: '2026.1.2'

scaling_config: {
    "InstanceFamilies": [
      "i8g"
    ],
    "Mode": "xcloud",
    "Policies": {
      "Storage": {
        "Min": 0,
        "TargetUtilization": 0.8
      },
      "VCPU": {
        "Min": 0
      }
    }
}
